[tools]
node = "20"
python = "3.10.12"

[tasks.default]
description = 'Serve'
depends = ['serve']

[tasks.install]
description = 'Install deps'
depends = ['install-pip', 'install-npm']
run = 'echo "If playwright needs to be upgraded, change version in package.json"'
alias = 'i'

[tasks.install-npm]
run = [
    'npm install',
    'npx playwright install chromium',
]
hide = true

[tasks.install-pip]
run = "pip install -r requirements.txt"
hide = true

[tasks.mkdocs-build]
description = 'Build MkDocs'
run = "mkdocs build"
alias = 'b'

[tasks.build]
description = 'Build the Zensical site'
run = 'zensical build'

[tasks.mkdocs-serve]
description = 'Build and Serve MkDocs'
run = "mkdocs serve"
alias = 't'

[tasks.serve]
description = 'Serve the Zensical site'
run = 'zensical serve'

[tasks.clean]
description = 'Clean built site directory'
run = "rm -rf site"
alias = 'c'
